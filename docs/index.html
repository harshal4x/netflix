<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Netflix Clone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">netflix</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <input id="search" placeholder="Search" />
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to the simple Netflix clone</h1>
        <p>Browse a small selection of sample movies.</p>
      </div>
    </section>

    <section class="movies-section">
      <h2>Trending Now</h2>
      <div id="movies" class="movies-grid"></div>
    </section>
  </main>

  <footer class="site-footer">Made with ❤️ — simple static demo</footer>

  <script src="script.js"></script>
</body>
</html>
